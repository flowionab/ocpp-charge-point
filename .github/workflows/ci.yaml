name: CI

# H1.7: PRs as well as pushes - previously `push` only, so a PR's first signal
# arrived after merge.
#
# H1.8: also run on a schedule, independent of push/PR activity. The
# `feature-matrix` incident wasn't a missing trigger - it ran, and failed, on
# every push for three-plus commits. The gap was that a red run on `main`
# produced no signal anyone was still watching once the pushes that caused it
# stopped landing. A scheduled run gives GitHub a push-independent reason to
# re-check `main` and re-notify (GitHub emails the last person to edit this
# workflow file when a scheduled run fails) even during a quiet week where
# nobody's push would have re-surfaced the failure. Weekday mornings, off the
# hour to dodge the top-of-hour scheduling crunch other repos pile onto.
# `workflow_dispatch` lets a maintainer re-run the same check by hand from the
# Actions tab without needing an empty commit.
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch: {}
  # Lets `release.yaml` run this exact file against the tagged commit rather
  # than keeping a second, drifting copy of the gates in the release pipeline.
  # A tag push does not match the `push` trigger above (it is branch-scoped),
  # so this adds a call path rather than duplicating a run.
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always
  # This crate is firmware: a warning here is a defect that ships.
  RUSTFLAGS: -D warnings

jobs:
  # H1.1 - formatting and lints are gating, not advisory.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      # The no_std configuration has its own cfg-gated code paths, so it needs
      # its own clippy run - `--all-features` never compiles them.
      - run: cargo clippy --no-default-features --lib
      # CLAUDE.md requires rustdoc on every public API; `missing_docs` is a
      # `warn` in lib.rs, which `RUSTFLAGS: -D warnings` promotes to an error
      # here without failing local builds.
      - run: cargo doc --all-features --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --all-features

  # H1.2: the configurations that actually ship. A full feature powerset is
  # mostly noise here because the version features (`ocpp_1_6`/`ocpp_2_0_1`/
  # `ocpp_2_1`) are the only genuinely independent axis - each version's
  # adapters must compile *alone*, without secretly depending on another
  # version's module. `cargo hack --each-feature` covers that axis directly,
  # and the named configurations below cover the runtime axis (no_std / std
  # without tokio / everything).
  #
  # C1.3: the 17 capability features (`reservation`, `smart-charging`, ...) are
  # a third axis, and it must be orthogonal to the version axis - any
  # combination has to compile. `--each-feature` already builds each capability
  # feature *alone*; the `Capability set:` steps below cover the combinations
  # that axis actually ships in, rather than its 2^17 powerset: everything off
  # (the smallest real build), a Core-only charger, Core + Smart Charging
  # (the first profile a real deployment adds), and (H1.8) every capability at
  # once under true no_std - see that step's comment for why the last one
  # earns its keep. `--all-features` above is the everything-on end (with
  # `tokio-runtime`/`std` present, unlike the no_std step). `--lib` because
  # `examples/` and `tests/` assume default features and are not part of the
  # capability contract.
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Each feature in isolation
        run: cargo hack check --each-feature --no-dev-deps --lib
      - name: True no_std (no default features)
        run: cargo check --no-default-features --lib
      # G1.3: the no_std claim is only useful if something demonstrates building against it. This
      # example supplies the critical-section backend, Executor, Clock and Backoff that
      # --no-default-features requires, so a change that quietly makes those unimplementable fails
      # here rather than in an integrator's tree.
      - name: Embedded bindings example builds without default features
        run: cargo build --example embedded_bindings --no-default-features
      # H2.6: the integrator-facing example, on the full std/tokio path.
      - name: Simulated charge point example builds
        run: cargo build --example simulated_charge_point
      - name: std, no tokio runtime
        run: cargo check --no-default-features --features std,ocpp_1_6,ocpp_2_0_1,ocpp_2_1 --lib
      - name: All features
        run: cargo check --all-features --all-targets
      - name: 'Capability set: all off, every version'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_1_6,ocpp_2_0_1,ocpp_2_1 --lib
      - name: 'Capability set: Core only'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_2_1,local-auth-list,reservation --lib
      - name: 'Capability set: Core + Smart Charging'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_2_1,local-auth-list,reservation,smart-charging --lib
      # H1.8: closes the gap the version x capability axes leave open. Every
      # step above enables capability features either alone (`--each-feature`)
      # or with `tokio-runtime`/`std` present; none of them enable a
      # capability feature under true `--no-default-features` together with
      # more than one or two others. That combination is exactly where five
      # capability modules broke last round: `async_trait` expands to a
      # `Box<dyn ...>` inside an inline `ocpp_2_*` adapter module, and without
      # that module's own `use alloc::boxed::Box;` it only fails to compile
      # once `std`'s prelude re-export of `Box` is gone *and* the capability
      # feature gating that module is on. Running every capability feature at
      # once under no_std, rather than a full 2^17 powerset, is the traded-off
      # middle ground: it can't localize *which* capability combination
      # broke, only that no_std + "everything a full deployment turns on"
      # still compiles, which is the combination CLAUDE.md's no_std goal
      # actually cares about. All three version features included since the
      # 2.1-only capabilities (der-control, battery-swap,
      # periodic-event-stream) need one to gate any code in.
      - name: 'Capability set: no_std, every capability, every version'
        run: cargo check --no-default-features --features ocpp_1_6,ocpp_2_0_1,ocpp_2_1,battery-swap,certificate-management,certificates,der-control,diagnostics,display-message,firmware-management,firmware-publishing,iso15118,key-storage,local-auth-list,ocsp-checking,payment,periodic-event-stream,reservation,smart-charging,tariff-cost,variable-monitoring --lib

  # H1.3 / G1.1: the target this crate exists for.
  #
  # G1.1: this used to be `cargo check --lib`, not `build`. `check` stops after type checking - it
  # never reaches codegen, so it cannot see a target-specific codegen failure. That is exactly the
  # shape of bug this crate has shipped twice: an `AtomicI64` compiles fine under `cargo check` on
  # any host or target (the type checker doesn't know or care that a target's atomic width is
  # narrower than the type), and only fails when LLVM actually tries to lower the atomic op for
  # `thumbv7em-none-eabihf`, which only happens during codegen. `cargo build --lib` runs full
  # codegen for the rlib - it still does not *link* a final executable (that additionally needs a
  # `critical-section` backend and an `Executor`/`Backoff`/`Clock`, which are the integrator's job
  # per CLAUDE.md, not this crate's), but codegen is precisely the phase the AtomicI64 bugs needed
  # to be caught in, and `build` reaches it while `check` does not. `getrandom_backend="custom"` is
  # the equivalent contract for `getrandom` (reached via `ocpp-client` -> `uuid`'s `v4` feature): on
  # a target it has no entropy source for, the final binary must register one; setting it here lets
  # the crate build for the target without actually providing an entropy source.
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Bare no_std build
        run: cargo build --no-default-features --lib --target thumbv7em-none-eabihf
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
      # G1.1: the bare build above only proves the version-independent core builds for the target.
      # Both AtomicI64 regressions were in feature-gated capability code (`certificates`,
      # `variable-monitoring`), and one sat broken on `main` for weeks because nothing built a
      # capability feature *for this target* - `feature-matrix`'s equivalent step only runs on the
      # host. This mirrors that step's feature list (every capability, every OCPP version, still
      # `--no-default-features` so `tokio-runtime`/`std` stay off) but with `build` in place of
      # `check`, for the same codegen-vs-typecheck reason as the step above. It does not attempt the
      # capability powerset on-target - one comprehensive combination, traded for CI runtime, same
      # trade `feature-matrix` already makes.
      - name: Every capability, every version, no_std build
        run: cargo build --no-default-features --features ocpp_1_6,ocpp_2_0_1,ocpp_2_1,battery-swap,certificate-management,certificates,der-control,diagnostics,display-message,firmware-management,firmware-publishing,iso15118,key-storage,local-auth-list,ocsp-checking,payment,periodic-event-stream,reservation,smart-charging,tariff-cost,variable-monitoring --lib --target thumbv7em-none-eabihf
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
      # G2.4: `tools/flash-probe` is the only thing in the repository that *links* a bare-metal
      # image rather than just building the lib, so it additionally catches breakage a `build`
      # above cannot (a missing symbol, a `critical-section` backend gone stale). `--quick` builds
      # only the core and all-features rows - enough to keep the probe honest without paying for
      # the whole table on every push. Re-run `scripts/flash-cost.sh` (no flag) by hand when
      # docs/MEMORY.md's flash figures need refreshing. This is also this crate's build-artifact
      # size signal: the script prints the flashable image size for each row, so a size regression
      # is visible in the job log even though nothing here fails the build on a size threshold - see
      # the accompanying report for why a hard threshold isn't added.
      - run: scripts/flash-cost.sh --quick

  # H1.4: enforces the `rust-version` declared in Cargo.toml, so bumping the
  # MSRV becomes a deliberate edit rather than an accident that silently drops
  # integrators pinned to an older toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  # H1.6: coverage, gated with a floor on the protocol adapters.
  #
  # Whole-crate coverage stays informational (`--summary-only`, no
  # `--fail-under-lines`): most of the low-coverage surface in that report is
  # error-path plumbing (hardware failure branches, `builder.rs` generic
  # wiring) where the missing tests are expensive relative to what they'd
  # catch, and gating on the crate-wide number would either sit slack forever
  # or start blocking unrelated work the day someone touches a big, hard file.
  #
  # The `ocpp_1_6.rs` / `ocpp_2_0_1.rs` / `ocpp_2_1.rs` files (one per
  # functional block: certificates, diagnostics, firmware, smart_charging)
  # are the version *adapters* CLAUDE.md calls out - they translate the
  # protocol-agnostic internal state to/from each wire format, so a silent
  # field-mapping bug there ships straight to a CSMS, and a test for one is
  # cheap (construct a state, assert the wire shape). That is what actually
  # gets gated below.
  #
  # cargo-llvm-cov has no "only report these files" flag, only
  # `--ignore-filename-regex` to exclude, so scoping to the adapters is done
  # by exporting full JSON (`cargo llvm-cov report --json`) once and
  # aggregating the matching files' line counts with `jq` - both reports come
  # from one instrumented test run (`--no-report` first, then `report` twice)
  # rather than paying for the run twice.
  #
  # Floor is 70%, chosen below the measured baseline of ~75.8% (2250/2969
  # lines across the 11 adapter files, all-features, on the commit this gate
  # was added) so the gate protects against regression rather than failing on
  # day one; it is not a target to stop at. Ratchet it up as adapter tests
  # are added rather than treating 70 as good enough.
  #
  # What this floor does *not* protect: it is a line-coverage percentage, so
  # it can be satisfied by exercising the easy/common branches of the 11
  # files repeatedly while leaving specific error-mapping arms untested, and
  # it says nothing about the many other `ocpp_1_6`/`ocpp_2_0_1`/`ocpp_2_1`
  # adapter *modules* that live inline inside larger files (e.g.
  # `authorization.rs`, `transactions.rs`) rather than as their own file -
  # llvm-cov reports at file granularity, so those aren't separable from the
  # rest of their file's coverage without deeper per-region tooling this gate
  # doesn't attempt. A green gate here is evidence the dedicated adapter
  # files didn't regress, not proof every adapter path is tested.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-features --no-report
      - run: cargo llvm-cov report --summary-only
      - name: Protocol adapter coverage floor
        env:
          FLOOR: "70.0"
        run: |
          cargo llvm-cov report --json --output-path /tmp/llvm-cov.json
          read -r covered total <<< "$(jq -r '
            .data[0].files
            | map(select(.filename | test("/(ocpp_1_6|ocpp_2_0_1|ocpp_2_1)\\.rs$")))
            | "\(map(.summary.lines.covered) | add) \(map(.summary.lines.count) | add)"
          ' /tmp/llvm-cov.json)"
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.2f", 100.0 * c / t }')
          echo "Protocol adapter (ocpp_1_6/ocpp_2_0_1/ocpp_2_1) line coverage: $covered/$total = $pct% (floor $FLOOR%)"
          awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p < f) }' && {
            echo "::error::Protocol adapter line coverage $pct% is below the $FLOOR% floor (H1.6)"
            exit 1
          }
          true

  # H1.5 / D3.3: licences and advisories, configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # H1.8: make a red gate visible.
  #
  # Before this job, "six green, one red" produced six green check marks and
  # one red one on the commit - a real signal, but one every job before this
  # one already gave, and that's exactly what went unread for three-plus
  # commits. This job is the one check a human (or a branch-protection rule)
  # needs to look at: it depends on every gating job above, so it is green
  # only when all of them are, and red - with the specific failed/cancelled
  # job named in both the job summary and an `::error::` annotation on this
  # run - the instant any one of them isn't. `if: always()` is required
  # because a job's default `if` skips it when an upstream `needs` dependency
  # fails, which would make this job silently skip (a grey check) instead of
  # failing (a red one) on exactly the runs it exists to catch.
  #
  # This job is necessary but not sufficient - it makes the aggregate status
  # legible, but nothing in this repository can force `main` to stay green.
  # That requires a maintainer to open Settings -> Branches -> Branch
  # protection rules for `main` (or Rulesets) and add `ci-required` as the
  # only required status check ("Require status checks to pass before
  # merging"). `gh api repos/:owner/:repo/branches/main/protection` from this
  # worktree returns "Branch not protected" (404) as of this change, so that
  # step has not been taken - it is a repository setting, not a file, and is
  # outside what this agent can configure from a checked-out worktree even if
  # it had write access to GitHub's API for it (see the accompanying report).
  ci-required:
    if: always()
    needs: [lint, test, feature-matrix, embedded, msrv, coverage, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check every gating job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "## CI gate summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in $(echo "$RESULTS" | jq -r 'keys[]'); do
            result=$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              echo "::error::Gating job '$job' finished with result '$result', not 'success'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**One or more gating jobs did not succeed - see the \`::error::\` annotations on this run.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All gating jobs succeeded." >> "$GITHUB_STEP_SUMMARY"
