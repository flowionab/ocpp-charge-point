name: CI

# H1.7: PRs as well as pushes - previously `push` only, so a PR's first signal
# arrived after merge.
on:
  push:
    branches: [main]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always
  # This crate is firmware: a warning here is a defect that ships.
  RUSTFLAGS: -D warnings

jobs:
  # H1.1 - formatting and lints are gating, not advisory.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      # The no_std configuration has its own cfg-gated code paths, so it needs
      # its own clippy run - `--all-features` never compiles them.
      - run: cargo clippy --no-default-features --lib
      # CLAUDE.md requires rustdoc on every public API; `missing_docs` is a
      # `warn` in lib.rs, which `RUSTFLAGS: -D warnings` promotes to an error
      # here without failing local builds.
      - run: cargo doc --all-features --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --all-features

  # H1.2: the configurations that actually ship. A full feature powerset is
  # mostly noise here because the version features (`ocpp_1_6`/`ocpp_2_0_1`/
  # `ocpp_2_1`) are the only genuinely independent axis - each version's
  # adapters must compile *alone*, without secretly depending on another
  # version's module. `cargo hack --each-feature` covers that axis directly,
  # and the named configurations below cover the runtime axis (no_std / std
  # without tokio / everything).
  #
  # C1.3: the 14 capability features (`reservation`, `smart-charging`, ...) are
  # a third axis, and it must be orthogonal to the version axis - any
  # combination has to compile. `--each-feature` already builds each capability
  # feature *alone*; the `Capability set:` steps below cover the combinations
  # that axis actually ships in, rather than its 2^14 powerset: everything off
  # (the smallest real build), a Core-only charger, and Core + Smart Charging
  # (the first profile a real deployment adds). `--all-features` above is the
  # everything-on end. `--lib` because `examples/` and `tests/` assume default
  # features and are not part of the capability contract.
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Each feature in isolation
        run: cargo hack check --each-feature --no-dev-deps --lib
      - name: True no_std (no default features)
        run: cargo check --no-default-features --lib
      # G1.3: the no_std claim is only useful if something demonstrates building against it. This
      # example supplies the critical-section backend, Executor, Clock and Backoff that
      # --no-default-features requires, so a change that quietly makes those unimplementable fails
      # here rather than in an integrator's tree.
      - name: Embedded bindings example builds without default features
        run: cargo build --example embedded_bindings --no-default-features
      # H2.6: the integrator-facing example, on the full std/tokio path.
      - name: Simulated charge point example builds
        run: cargo build --example simulated_charge_point
      - name: std, no tokio runtime
        run: cargo check --no-default-features --features std,ocpp_1_6,ocpp_2_0_1,ocpp_2_1 --lib
      - name: All features
        run: cargo check --all-features --all-targets
      - name: 'Capability set: all off, every version'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_1_6,ocpp_2_0_1,ocpp_2_1 --lib
      - name: 'Capability set: Core only'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_2_1,local-auth-list,reservation --lib
      - name: 'Capability set: Core + Smart Charging'
        run: cargo check --no-default-features --features tokio-runtime,ocpp_2_1,local-auth-list,reservation,smart-charging --lib

  # H1.3: the target this crate exists for. `cargo check` (not build) because
  # linking a bare-metal binary additionally needs a `critical-section` backend
  # and an `Executor`/`Backoff`/`Clock`, all of which the integrator supplies -
  # see CLAUDE.md. `getrandom_backend="custom"` is the equivalent contract for
  # `getrandom` (reached via `ocpp-client` -> `uuid`'s `v4` feature): on a
  # target it has no entropy source for, the final binary must register one.
  # Setting it here proves the crate compiles for the target; it does not
  # provide an actual entropy source.
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --lib --target thumbv7em-none-eabihf
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
      # G2.4: `tools/flash-probe` is the only thing in the repository that *links* a bare-metal
      # image rather than just checking one, so it catches breakage `cargo check` cannot (a missing
      # symbol, a `critical-section` backend gone stale). `--quick` builds only the core and
      # all-features rows - enough to keep the probe honest without paying for the whole table on
      # every push. Re-run `scripts/flash-cost.sh` (no flag) by hand when docs/MEMORY.md's flash
      # figures need refreshing.
      - run: scripts/flash-cost.sh --quick

  # H1.4: enforces the `rust-version` declared in Cargo.toml, so bumping the
  # MSRV becomes a deliberate edit rather than an accident that silently drops
  # integrators pinned to an older toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  # H1.6: coverage, gated with a floor on the protocol adapters.
  #
  # Whole-crate coverage stays informational (`--summary-only`, no
  # `--fail-under-lines`): most of the low-coverage surface in that report is
  # error-path plumbing (hardware failure branches, `builder.rs` generic
  # wiring) where the missing tests are expensive relative to what they'd
  # catch, and gating on the crate-wide number would either sit slack forever
  # or start blocking unrelated work the day someone touches a big, hard file.
  #
  # The `ocpp_1_6.rs` / `ocpp_2_0_1.rs` / `ocpp_2_1.rs` files (one per
  # functional block: certificates, diagnostics, firmware, smart_charging)
  # are the version *adapters* CLAUDE.md calls out - they translate the
  # protocol-agnostic internal state to/from each wire format, so a silent
  # field-mapping bug there ships straight to a CSMS, and a test for one is
  # cheap (construct a state, assert the wire shape). That is what actually
  # gets gated below.
  #
  # cargo-llvm-cov has no "only report these files" flag, only
  # `--ignore-filename-regex` to exclude, so scoping to the adapters is done
  # by exporting full JSON (`cargo llvm-cov report --json`) once and
  # aggregating the matching files' line counts with `jq` - both reports come
  # from one instrumented test run (`--no-report` first, then `report` twice)
  # rather than paying for the run twice.
  #
  # Floor is 70%, chosen below the measured baseline of ~75.8% (2250/2969
  # lines across the 11 adapter files, all-features, on the commit this gate
  # was added) so the gate protects against regression rather than failing on
  # day one; it is not a target to stop at. Ratchet it up as adapter tests
  # are added rather than treating 70 as good enough.
  #
  # What this floor does *not* protect: it is a line-coverage percentage, so
  # it can be satisfied by exercising the easy/common branches of the 11
  # files repeatedly while leaving specific error-mapping arms untested, and
  # it says nothing about the many other `ocpp_1_6`/`ocpp_2_0_1`/`ocpp_2_1`
  # adapter *modules* that live inline inside larger files (e.g.
  # `authorization.rs`, `transactions.rs`) rather than as their own file -
  # llvm-cov reports at file granularity, so those aren't separable from the
  # rest of their file's coverage without deeper per-region tooling this gate
  # doesn't attempt. A green gate here is evidence the dedicated adapter
  # files didn't regress, not proof every adapter path is tested.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-features --no-report
      - run: cargo llvm-cov report --summary-only
      - name: Protocol adapter coverage floor
        env:
          FLOOR: "70.0"
        run: |
          cargo llvm-cov report --json --output-path /tmp/llvm-cov.json
          read -r covered total <<< "$(jq -r '
            .data[0].files
            | map(select(.filename | test("/(ocpp_1_6|ocpp_2_0_1|ocpp_2_1)\\.rs$")))
            | "\(map(.summary.lines.covered) | add) \(map(.summary.lines.count) | add)"
          ' /tmp/llvm-cov.json)"
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.2f", 100.0 * c / t }')
          echo "Protocol adapter (ocpp_1_6/ocpp_2_0_1/ocpp_2_1) line coverage: $covered/$total = $pct% (floor $FLOOR%)"
          awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p < f) }' && {
            echo "::error::Protocol adapter line coverage $pct% is below the $FLOOR% floor (H1.6)"
            exit 1
          }
          true

  # H1.5 / D3.3: licences and advisories, configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
