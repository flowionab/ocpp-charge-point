[package]
edition = '2024'
name = "ocpp-charge-point"
version = "0.1.0"
description = "OCPP Charge Point Implementation. Use this library to implement an OCPP charge point"
repository = "https://github.com/flowionab/ocpp-charge-point"
license = "MIT OR Apache-2.0"
authors = ["Joatin Granlund <joatin@granlund.io>"]
keywords = ["OCPP", "CP", "ChargePoint", "ocpp16", "ocpp201"]
# crates.io's own slugs, not free text - an unrecognised one is dropped silently on publish. Five
# keywords and five categories is the per-crate ceiling for both, so both lists are full. `no-std`
# and `embedded` are the load-bearing pair: this crate's differentiator against other OCPP crates
# is that it builds for a microcontroller, and those are the two categories someone shopping for
# firmware filters on.
categories = ["embedded", "no-std", "network-programming", "asynchronous", "api-bindings"]
# Verified, not guessed: 1.87 fails to compile this crate (`src/state/` uses
# let-chains, stable only from 1.88), and several transitive dependencies
# already require 1.86/1.87. CI enforces this on every push - see the `msrv`
# job in `.github/workflows/ci.yaml`.
rust-version = "1.88"
# Editor-local settings carry nothing a consumer of the published crate needs, and `.idea/`
# shipped in the 0.1.0 packaging dry-run. Everything else in the tarball (docs/, examples/,
# tests/, scripts/) is deliberate: the docs are the integrator's guide and the roadmap they are
# told to read, and the spec PDFs under `docs/OCPP-2.*` are gitignored so they never reach it.
exclude = [".idea/"]

# docs.rs builds default features unless told otherwise. Every capability feature is now in
# `default`, so this changes nothing today - it is here so that a future non-default feature
# (and its gated public items) cannot go missing from the rendered docs without anyone noticing.
[package.metadata.docs.rs]
all-features = true

[features]
# Forwards to ocpp-client's own `std` feature (validator/regex-based payload validation), to
# chrono's `clock` feature (`Utc::now()`, used by `clock::SystemClock`), and to
# critical-section's `std` backend (used by `src/sync.rs`'s embassy-sync-backed primitives, via
# `CriticalSectionRawMutex` - without a backend registered, linking any binary that touches the
# actor's channels fails). Does NOT imply `tokio-runtime`: `std` alone is a real configuration
# (e.g. a std binary using a non-tokio async executor, supplying its own `Executor`/`Backoff`).
std = ["ocpp-client/std", "chrono/clock", "critical-section/std", "tracing/std"]
# `TokioExecutor`/`TokioBackoff` (the tokio-backed `Executor`/`Backoff` impls). Implies `std`.
# Mirrors ocpp-client's own `tokio-runtime` feature/convention.
tokio-runtime = ["std", "dep:tokio"]
# `tokio-runtime` (and therefore `std`) in default features for zero-config ergonomics, matching
# `ocpp-client`'s own convention; embedded targets build with `--no-default-features` and
# register their own critical-section backend via `critical_section::set_impl!`, plus supply
# their own `Executor`/`Backoff`/`Clock` (see `docs/ROADMAP.md` §0).
default = [
    "tokio-runtime",
    "websocket",
    "ocpp_1_6",
    "ocpp_2_0_1",
    "ocpp_2_1",
    "smart-charging",
    "firmware-management",
    "firmware-publishing",
    "diagnostics",
    "variable-monitoring",
    "display-message",
    "reservation",
    "local-auth-list",
    "tariff-cost",
    "payment",
    "iso15118",
    "der-control",
    "battery-swap",
    "periodic-event-stream",
    "certificates",
    "certificate-management",
    "key-storage",
    "ocsp-checking",
]
ocpp_1_6 = ["ocpp-client/ocpp_1_6"]
ocpp_2_0_1 = ["ocpp-client/ocpp_2_0_1"]
ocpp_2_1 = ["ocpp-client/ocpp_2_1"]
# Forwards to ocpp-client's own `websocket` feature (tokio-tungstenite-backed WebSocket
# transport, `connect_1_6`/`connect_2_0_1`/`connect_2_1`). Implies `tokio-runtime` (and
# therefore `std`), same as `ocpp-client`'s own convention - a WebSocket transport inherently
# needs a tokio runtime. In `default` for zero-config ergonomics; embedded/no_std targets that
# supply their own transport build with `--no-default-features`.
websocket = ["tokio-runtime", "ocpp-client/websocket"]

# --- Functional-block capability features (docs/PRODUCTION-ROADMAP.md §5.1, C1) ---
#
# One feature per optional OCPP functional block, orthogonal to the `ocpp_1_6`/`ocpp_2_0_1`/
# `ocpp_2_1` version features above - any combination of the two groups must compile (verified in
# CI's feature-matrix job). All of them start in `default` so existing users see no behavioural
# change from this crate gaining the ability to turn a block off. Turning one off saves flash on
# an image that will never exercise that block (e.g. an MCU build with no reservation hardware
# story) rather than changing what's negotiated at runtime - see
# `docs/PRODUCTION-ROADMAP.md` §5 for why this is a compile-time, not runtime, decision. See
# README.md for the certification-profile mapping (C1.2) and the recommended set per hardware
# class (C1.4).
#
# Blocks that already have code gate that code out entirely when disabled (module declarations,
# re-exports, and `ChargePointBuilder` registration methods - see `src/lib.rs`/`src/builder.rs`).
# Blocks with no code yet are declared now, ready for their implementation to land behind the
# flag, and gate nothing today - each says so below.

# Gates the CSMS-facing Smart Charging registration methods (SetChargingProfile,
# GetCompositeSchedule, dynamic/priority charging profiles and their persistence and
# notifications, roadmap workstream B2/B8.2) via `ChargePointBuilder::smart_charging` and its
# siblings, plus `crate::setup::setup`'s own runtime capability check (C4.2/C4.3). Does **not**
# gate `crate::smart_charging` itself - that module's types are load-bearing for
# `crate::tariff`/`crate::device_model`/`crate::provisioning` regardless of this feature, so it
# stays compiled in even with this feature off; only the registration entry points disappear.
smart-charging = []
# Declares the Firmware Management capability. The block itself (roadmap B3.2) is registered
# through `ChargePointBuilder::firmware_updates`, which needs hardware bindings the feature flag
# cannot supply, so this gates advertisement rather than compilation.
firmware-management = []
# Declares the Firmware Publishing (local controller) capability - `PublishFirmware`/
# `UnpublishFirmware`/`PublishFirmwareStatusNotification` (roadmap B3.4, 2.x only), registered
# through `ChargePointBuilder::publish_firmware` with a `hardware::FileTransfer` and a
# `hardware::FirmwarePublisher`. Independent of `firmware-management`: a charge point can update
# its own firmware without being a local controller, and vice versa.
firmware-publishing = []
# Declares the Diagnostics capability - log upload (roadmap B5.1) is registered through
# `ChargePointBuilder::log_uploads`. `GetTransactionStatus` (B5.4), `CustomerInformation` (B5.5)
# and the variable monitoring engine and its reports (B5.2/B5.3) have since landed; what remains
# unimplemented in this block is 2.1's periodic event streams, which have their own
# `periodic-event-stream` feature.
diagnostics = []
# Gates `ChargePointBuilder::certificates` - Install/Delete/GetInstalledCertificateIds (roadmap
# B4.2), registered with a `hardware::CertificateStore`. In `default` like every other capability
# feature: these flags exist to let an image drop a block it will never exercise, not to make a
# block opt-in. It was the one gate missing from `default` until 0.1.0, which made its builder
# method unreachable for default-features users and invisible on docs.rs;
# `every_capability_gate_feature_is_in_the_default_feature_set` in `src/hardware/capabilities.rs`
# now fails if any gate drifts back out.
certificate-management = []
# Gates the CSMS-facing Variable Monitoring registration methods
# (SetVariableMonitoring/ClearVariableMonitoring/monitoring reports/monitor-event notification,
# roadmap B5.2/B5.3) via `ChargePointBuilder::variable_monitoring` and its siblings, plus
# `crate::setup::setup`'s own runtime capability check (C4.2/C4.3;
# `crate::hardware::CAPABILITY_GATES`'s `variable_monitoring` row). Does not gate
# `crate::variable_monitoring` itself, for the same reason `smart-charging` doesn't gate
# `crate::smart_charging` - see that feature's docs.
variable-monitoring = []
# Gates `crate::display_message` (SetDisplayMessage/GetDisplayMessages/ClearDisplayMessage,
# answered via NotifyDisplayMessages - roadmap B6) and
# `ChargePointBuilder::display_messages`, which registers them against a `hardware::Display`.
# 2.x only - 1.6J has no display-message concept. Off by default in a build with no display
# hardware/UX story.
display-message = []
# Gates `crate::reservation` (the `ReserveNowHandler`/`CancelReservationHandler` traits) and
# `ChargePointBuilder::reservation`, which register them. Off by default in a build that has no
# reservation UX/hardware story.
reservation = []
# Gates `crate::local_authorization_list` (the `SendLocalListHandler`/`GetLocalListVersionHandler`
# traits) and `ChargePointBuilder::local_authorization_list`, which register them.
local-auth-list = []
# Gates `crate::cost` (the `CostUpdatedHandler` trait, OCPP `CostUpdated`) and
# `ChargePointBuilder::cost`, which registers it. 2.1's richer tariff/`SetDefaultTariff` surface
# (roadmap B7.1) isn't implemented yet and gates nothing additional today.
tariff-cost = []
# Gates `crate::payment` (2.1-only: NotifySettlement/NotifyWebPaymentStarted/
# VatNumberValidation, roadmap B7.2) and `crate::hardware::PaymentTerminal`/
# `ChargePointBuilder::payment`, which registers a payment terminal's identity against
# `PaymentCtrlr`'s device-model variables. `SetDefaultTariff` is 2.1's tariff surface (B7.1,
# `tariff-cost`), not this feature.
payment = []
# Gates `crate::iso15118` (`Get15118EVCertificate`, roadmap B4.5, 2.x only), which uses
# `crate::hardware::Iso15118Controller`/`NoIso15118Controller` (those hardware types themselves
# are unconditional, like `hardware::OcspChecker`/`CertificateStore`). Charge-point-initiated - no
# `ChargePointBuilder` registration, see that module's docs. Advertised via
# `Capabilities::iso15118_support` (an `Iso15118SupportLevel`, not a bool - see
# `hardware::capabilities`), already wired into `CAPABILITY_GATES`.
iso15118 = []
# Gates `crate::der_control` (GetDERControl/SetDERControl/ClearDERControl/ReportDERControl,
# NotifyDERAlarm/NotifyDERStartStop, AFRRSignal, NotifyAllowedEnergyTransfer - roadmap B8.2) and
# `ChargePointBuilder::der_control`, which registers the CSMS-initiated handlers against it. 2.1
# only - see the module's docs.
der-control = []
# Gates `crate::battery_swap` (`BatterySwap` outbound / `RequestBatterySwap` inbound, roadmap
# B8.3) and `ChargePointBuilder::battery_swap`, which registers them against a
# `hardware::BatterySwapStation`. 2.1-only, and niche: a conventional charge point has no swap
# hardware, so an absent runtime capability refuses `RequestBatterySwap` through `crate::refusal`
# even in a build with this feature on.
battery-swap = []
# Gates `crate::periodic_event_stream` (`OpenPeriodicEventStream`/`ClosePeriodicEventStream`/
# `AdjustPeriodicEventStream`/`GetPeriodicEventStream`/`NotifyPeriodicEventStream`, roadmap B5.6)
# and `ChargePointBuilder::periodic_event_streams`, which registers them. 2.1-only. Off by
# default in a build with no periodic-streaming CSMS integration.
periodic-event-stream = []
# Gates nothing yet: certificate store/install/CSR (roadmap B4.1-B4.4) has no implementation in
# this crate yet.
certificates = []

# --- Diagnostics escape hatch (deliberately NOT in `default`) ---
#
# Restores the full `IdToken` value in `Debug`/`tracing` output. Off by default because an
# `IdToken` value is the number on the card in a driver's wallet: personal data, and the charge
# point actor formats a `ChargePointEvent` (which carries one) on every applied event. Redacting
# in `IdToken`'s own `Debug` impl rather than at each call site means a new log line cannot
# reintroduce the leak by forgetting about it - see `crate::state::IdToken`.
#
# Turn this on for local bring-up against a bench CSMS when you need to correlate a specific card
# with a specific `Authorize`. Never ship an image with it on.
unredacted-logs = []
# Declares the key-storage capability - `crate::hardware::KeyStore` (roadmap F2.4), a home for
# private keys (secure-element-backed or a `Storage`-backed software fallback via
# `crate::hardware::SoftKeyStore`) that never gives up key material. No OCPP messages consume
# this yet: it exists for F1.3 (mutual TLS) and B4.3 (CSR generation/renewal) to build on.
key-storage = []
# Declares the ocsp-checking capability - `crate::hardware::OcspChecker` (roadmap B4.4), registered
# through `ChargePointBuilder::ocsp_status`/`ChargePointBuilder::ocsp_chain_status`. Deliberately
# its own feature rather than reusing `certificate-management`: see
# `crate::hardware::Capabilities::ocsp_checking`'s docs for why the two are independent hardware
# facts.
ocsp-checking = []

[dependencies]
# `rt-multi-thread` is here for `crate::mutual_tls`'s `KeyStoreSigner` (F1.3): rustls's `Signer`
# trait is synchronous, but `hardware::KeyStore::sign` is async, so bridging the two needs
# `tokio::task::block_in_place` - which is only compiled in under this feature, and only actually
# works (rather than panicking) on a multi-thread runtime. See `crate::mutual_tls`'s module docs
# for the full explanation of why this bridge exists and its one hard requirement.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"], optional = true }
# The `chrono` feature forwards to `ocpp-types`' own: `From` between `OcppTimestamp` and
# `chrono::DateTime<Utc>` and back. `ocpp-types` 0.2.0 made every wire `dateTime` an
# `OcppTimestamp` rather than a
# `String`, and this crate keeps time as `chrono::DateTime<Utc>` internally (see `crate::clock`),
# so the conversion is on every outbound and inbound protocol path. Enabled unconditionally, not
# behind this crate's `std`: `ocpp-types` takes chrono as `default-features = false`, so it costs
# the bare-metal build nothing, and chrono is already a direct dependency below.
ocpp-client = { version = "0.5.0", default-features = false, features = ["chrono"] }
async-trait = "^0.1"
# `default-features = false` drops `tracing`'s (really `tracing-core`'s) `std` feature, which
# pulls in `once_cell` - and `once_cell`'s default build does not compile for a bare-metal
# target at all. Without this, `cargo check --target thumbv7em-none-eabihf
# --no-default-features` fails in `once_cell` before it ever reaches this crate's own code, so
# the `#![no_std]` support CLAUDE.md calls for was only ever verified on a host target. The
# macros (`tracing::info!` etc.) are unaffected; `std` re-enables the feature for host builds.
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
# `alloc` is unconditional (not tied to this crate's own `std` feature): this crate is
# alloc-always per CLAUDE.md's no_std+alloc stance, and the OCPP 2.1 TransactionEvent/
# StatusNotification wire timestamps are plain `String`s (ocpp-types doesn't depend on chrono),
# so producing them from a `chrono::DateTime<Utc>` via `to_rfc3339()` needs chrono's `alloc`
# feature regardless of whether `std` is enabled.
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }

# Persistence (docs/PRODUCTION-ROADMAP.md §7, workstream E): the state that must survive a power
# cut is serialized through `hardware::Storage` as JSON. Both are `no_std`+`alloc`-clean with
# default features off, so this doesn't cost the embedded build an `std` dependency. JSON rather
# than a compact binary format on purpose: a persisted transaction record is the evidence behind a
# billing dispute, and being able to read it off a device with `cat` is worth the extra bytes.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# no_std+alloc-friendly Mutex/Signal primitives backing src/sync.rs - used unconditionally by
# the actor regardless of the `std` feature. Mirrors ocpp-client's own use of these.
embassy-sync = { version = "0.8", default-features = false }
critical-section = { version = "1" }

# Matches the version `ocpp-types` (via `ocpp-client`) is built against - needed directly here
# to construct its `heapless::String<N>`-bounded wire fields (e.g. transaction/id-token ids)
# via `heapless::String::try_from`.
heapless = { version = "0.8", default-features = false }

[dev-dependencies]
tokio = { version = "1.39", features = ["full"]}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
serde_json = "1"
